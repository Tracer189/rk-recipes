name: Validate Recipe Website

on:
  push:
    branches:
      - master
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate HTML structure
        run: |
          echo "🔍 Validating index.html..."
          if [ ! -f index.html ]; then
            echo "❌ ERROR: index.html not found!"
            exit 1
          fi
          echo "✅ index.html exists"

          if grep -q "const recipeData = {" index.html; then
            echo "✅ Recipe data object found"
          else
            echo "❌ ERROR: Recipe data not found"
            exit 1
          fi

          if grep -q "class=\"card\"" index.html; then
            echo "✅ Recipe cards found"
          else
            echo "❌ ERROR: Recipe cards not found"
            exit 1
          fi

      - name: Check pagination settings
        run: |
          if grep -q "const RECIPES_PER_PAGE = 15" index.html; then
            echo "✅ Pagination is set to 15 recipes per page"
          else
            echo "⚠️  WARNING: Pagination setting not found, check if this is intentional"
          fi

      - name: Verify CNAME
        run: |
          if [ -f CNAME ]; then
            echo "✅ CNAME file found: $(cat CNAME)"
          else
            echo "⚠️  WARNING: CNAME file not found"
          fi

      - name: Validation complete
        run: echo "✅ All validations passed! GitHub Pages will auto-deploy from master branch."
